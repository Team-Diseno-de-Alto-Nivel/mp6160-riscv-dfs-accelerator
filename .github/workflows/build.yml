name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      hls: ${{ steps.filter.outputs.hls }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'Makefile'
              - '.devcontainer/**'
            hls:
              - 'src/hls/**'
              - 'src/program/**'
              - 'src/vivado/**'
              - 'Makefile'
              - '.github/workflows/build.yml'

  # FPGA-1 (#62): guards the HLS kernel without needing a Vitis license. Runs on a
  # bare runner instead of the dev container so it reports in well under a minute,
  # independently of the (much slower) container build below.
  hls-host:
    needs: changes
    if: needs.changes.outputs.hls == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Also enforces the kFootprintBudgetBytes static_assert in dfs_accel.cpp:
      # bumping kMaxRows/kMaxCols or widening cell_t fails the compile, not review.
      - name: Kernel vs software reference on the 21 golden cases
        run: make hls-host

      # Out-of-bounds on the explicit frame stack is the failure mode that passes
      # functionally on the host and breaks in RTL, so it must be caught here.
      - name: Same check under ASan/UBSan
        run: make hls-host HLS_CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      # FPGA-2 (#63): guards run_hls.tcl without needing a Vitis license. Runs the
      # real script under plain tclsh with stub procs standing in for the
      # Vitis-only commands, so a broken path/part/clock is caught here instead of
      # the next time someone with Vitis actually runs it.
      # tclsh isn't in the ubuntu-latest image manifest, so install it explicitly
      # rather than assume it happens to be dragged in by something else.
      - name: Validate run_hls.tcl (no Vitis license needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl
          tclsh src/hls/scripts/validate_run_hls.tcl

      # FPGA-3 (#64): guards build_bd.tcl the same way -- stub procs instead of
      # a real Vivado, so a broken part/board_part/PS port/clock or a dropped
      # AXI connection is caught here instead of the next time someone with
      # Vivado opens the block design.
      - name: Validate build_bd.tcl (no Vivado license needed)
        run: tclsh src/vivado/scripts/validate_build_bd.tcl

      # FPGA-6 (#67): guards build_bitstream.tcl the same way -- a broken
      # PL0 override, step order, or write_bitstream/copy logic is caught
      # here instead of the next time someone with Vivado + the KV260 runs it.
      - name: Validate build_bitstream.tcl (no Vivado license needed)
        run: tclsh src/vivado/scripts/validate_build_bitstream.tcl

      # FPGA-6 (#67): unlike the Vivado/Vitis scripts above, this one needs
      # no proprietary license, so it's a real functional check, not a
      # stub: regenerate src/pynq/cases.json and diff it against the
      # committed copy. Catches someone changing datasets.cpp (or the
      # mode/flags mapping in kernel_io.h) without regenerating the fixture
      # the PYNQ notebook validates on-board results against.
      - name: Verify src/pynq/cases.json is up to date
        run: |
          make pynq-export-cases
          if [ -n "$(git status --porcelain -- src/pynq/cases.json)" ]; then
            echo "src/pynq/cases.json is stale (or was never committed) -- run 'make pynq-export-cases' and commit the result"
            git diff -- src/pynq/cases.json
            exit 1
          fi

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: dfs-riscv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build project
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            make

      - name: Run unit tests (src/model)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ctest --test-dir src/model/build --output-on-failure

      - name: Run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ./src/model/build/sim src/program/build/program

      - name: Verify program under RISC-V emulation (qemu-system, bare-metal)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            timeout 120 qemu-system-riscv64 -machine virt -nographic -bios none \
            -kernel ./src/program/build/program

      - name: Verify program native build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            make -C src/program run-native

      - name: Run unit tests (src/program native)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ctest --test-dir src/program/build-native --output-on-failure

      - name: Run experiments (OFF/ON) and program<->model co-simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            bash scripts/run_experiments.sh

      - name: Generate metrics tables and plots
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            python3 scripts/plot_results.py

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
