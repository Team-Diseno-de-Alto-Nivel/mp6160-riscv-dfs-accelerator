name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'Makefile'
              - '.devcontainer/**'

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: dfs-riscv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build project
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            make

      - name: Run unit tests (src/model)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ctest --test-dir src/model/build --output-on-failure

      - name: Run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ./src/model/build/sim src/program/build/program

      - name: Verify program under RISC-V emulation (qemu-system, bare-metal)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            timeout 120 qemu-system-riscv64 -machine virt -nographic -bios none \
            -kernel ./src/program/build/program

      - name: Verify program native build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            make -C src/program run-native

      - name: Run unit tests (src/program native)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            ctest --test-dir src/program/build-native --output-on-failure

      - name: Run experiments (OFF/ON) and program<->model co-simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            bash scripts/run_experiments.sh

      - name: Generate metrics tables and plots
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            python3 scripts/plot_results.py

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/
