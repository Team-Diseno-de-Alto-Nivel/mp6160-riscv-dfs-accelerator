name: Demo video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: dfs-riscv:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build project
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            dfs-riscv:ci \
            make

      - name: Install recording tools (asciinema, agg, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y asciinema ffmpeg
          curl -fL -o /tmp/agg \
            https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          sudo mv /tmp/agg /usr/local/bin/agg

      - name: Record demo
        run: |
          asciinema rec --overwrite \
            --command "docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace dfs-riscv:ci make demo" \
            demo.cast

      - name: Render MP4
        run: |
          agg --font-size 20 demo.cast demo.gif
          ffmpeg -y -i demo.gif \
            -movflags +faststart -pix_fmt yuv420p \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            demo.mp4

      - name: Upload demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            demo.mp4
            demo.cast
